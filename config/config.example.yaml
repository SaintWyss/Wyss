# Wyss — Configuración de ejemplo
# Copiar como config.yaml y completar con valores reales
# NUNCA commitear config.yaml con secretos

# Identidad del owner
owner:
  name: "Santiago Wyss"

# Proveedores de IA (los valores reales van en .env)
gateway:
  default_cheap_model: "gemini-flash"      # alias → proveedor real en .env
  default_strong_model: "claude-sonnet"    # alias → proveedor real en .env
  providers:
    - alias: "claude-sonnet"
      provider: "anthropic"
      model: "claude-sonnet-4-6"
    - alias: "gemini-flash"
      provider: "google"
      model: "gemini-2.0-flash"

# Bases de conocimiento
knowledge_bases:
  - id: "personal"
    name: "BC Personal"
    source_type: "local_folder"
    location: "~/archivos"          # reemplazar con ruta real
    sensitivity_level: "high"
  - id: "ragcorp"
    name: "BC RAGcorp"
    source_type: "local_folder"
    location: "~/ragcorp"
    sensitivity_level: "high"

# Almacenamiento local
storage:
  db_path: "data/wyss.db"
  vector_store: "data/vectors/"
  audit_log: "data/audit.db"

# Política cognitiva
policy:
  require_confirmation_level_b: true
  require_confirmation_level_c: true
  reject_level_d: true              # inviolable

# Agentes iniciales (instancias del modelo base)
agents:
  - id: "belgrano"
    name: "Belgrano"
    domain: "estudio"
    assigned_model: "claude-sonnet"
    budget_monthly_usd: 5.0
    knowledge_bases: []             # se habilitan vía Permission
