# Wyss — Configuración de ejemplo (formato canónico TOML, D-09)
# Copiar como config.toml y completar con valores reales.
#
# NUNCA poner secretos ni API keys aquí: las claves de proveedores van en
# `config/.env.example` → `.env` (que está en .gitignore). Esta config solo
# describe estructura, rutas y umbrales — todo no sensible.

# Directorio raíz de datos de runtime (índices, vectores, cache).
data_dir = "data"

# Audit store en SQLite SEPARADO de los datos de usuario (D-06).
audit_db = "data/audit.db"

# Política cognitiva: umbrales de agregación anti-bypass (POL-05).
# Son los defaults de RESEARCH §3.2; ajustables por el owner.
[policy]
# > file_count_b targets modificados distintos → mínimo B.
file_count_b = 10
# > file_count_c targets modificados distintos → mínimo C.
file_count_c = 100
# > dir_count_c directorios distintos tocados por escritura → mínimo C.
dir_count_c = 5
# > delete_count_d acciones file.delete agregadas → D (denylist built-in).
delete_count_d = 50

# Directorios/patrones sensibles: una escritura sobre ellos escala el nivel.
# Estos NO son la denylist de nivel D (esa vive en código, no es removible);
# son señales de sensibilidad que suben el riesgo estimado.
sensitive_dirs = [
  "~/.ssh",
  "/etc",
  "/boot",
  "data",          # el data dir de Wyss — regla #6 (auto-protección)
  "**/.env*",
  "**/*.key",
  "**/id_rsa*",
]

# Reglas de denegación ADICIONALES (opcional).
#
# Regla #2 — INVARIANTE ESTRUCTURAL: las reglas de config solo AGREGAN a la
# denylist built-in. Los invariantes de nivel D viven en código
# (`core/policy/builtin_deny.py`, Final) y NO son removibles por config:
# un TOML jamás puede vaciar ni desactivar la denylist. Si pudiera, el nivel D
# dejaría de ser absoluto editando un archivo.
#
# Ejemplo (comentado) de cómo el owner amplía la denylist:
# [[policy.deny]]
# id = "no-tocar-proyectos-criticos"
# match_target = "~/Data/10_Workspace/projects/**"
# match_action = "file.delete"

# ─────────────────────────────────────────────────────────────────────────────
# Gateway de modelos (Fase 2): único punto de salida a IA externa (GATE-01..05).
#
# NUNCA poner API keys acá: ANTHROPIC_API_KEY / LITELLM_MASTER_KEY viven SOLO en
# `.env` (os.environ) — el gateway las lee del entorno, jamás de este archivo.
[gateway]
# Presupuesto GLOBAL mensual en USD (hard-stop pre-autorizado, D-18). Al agotarse,
# la llamada se veta ANTES de salir; el destrabe es editar esto + reload (D-19).
global_budget = 50.0
# Timeout por llamada en segundos (D-25).
timeout_s = 120.0
# Retención de traces en días; los traces vencidos se purgan (audit es forever, D-22).
trace_retention_days = 90

# Tiers: el caller declara el tier, el router resuelve a provider+modelo (D-16, sin
# fallback automático entre tiers, D-17). Los aliases referencian modelos REALES del
# LiteLLM del owner (localhost:4000): gemini-default, deepseek-default, qwen-default.
[gateway.tiers.economico]
provider = "litellm"
model_alias = "gemini-default"
max_tokens = 1024

[gateway.tiers.fuerte]
provider = "anthropic"
model_alias = "claude-opus-4-6"
max_tokens = 4096

# Tabla de precios LOCAL por alias (USD por 1K tokens, D-24): el costo se calcula
# determinístico acá, nunca dependiendo de que el provider lo reporte bien.
[gateway.prices]
gemini-default = 0.0005
deepseek-default = 0.0003
qwen-default = 0.0004
claude-opus-4-6 = 0.015

# Límite opcional por agente (USD/mes). Es el campo que `CostTracker.authorize`
# realmente lee para vetar (D-18): `[[agents]].budget_usd` por sí solo NO cablea el gate
# (RESEARCH Pitfall 1). Pellegrini lleva tope chico a propósito (D-81/D-85, $5).
[gateway.agent_budgets]
belgrano = 10.0
pellegrini = 5.0

# Patrones de secreto ADICIONALES (D-21): se AGREGAN a los built-in (sk-ant-, AKIA,
# ghp_, JWT, PEM...), nunca los vacían. Útil para formatos internos del owner.
# [[gateway.secret_patterns]]
# name = "token_interno_wyss"
# regex = "WYSS-[A-Z0-9]{16}"

# ─────────────────────────────────────────────────────────────────────────────
# Orquestador conversacional.
[orchestrator]
# Default: fake determinístico local para desarrollo y pruebas sin red.
# "llm" usa el gateway real: requiere config/.env y proveedor alcanzable.
mode = "deterministic"
# Tier que usará el orquestador cuando mode = "llm".
tier = "economico"
# Tope opcional por-agente para el agente interno "orchestrator".
# Si [gateway.agent_budgets].orchestrator existe, ese valor explícito gana.
# budget_usd = 2.0

# ─────────────────────────────────────────────────────────────────────────────
# Agentes declarativos (Fase 7+, D-73): cada [[agents]] se valida al boot y se
# convierte en un AgentDefinition frozen. Agregar un agente NO toca código (regla de
# extensibilidad). `model_tier` referencia un tier de [gateway.tiers]; `budget_usd` es
# informativo — el tope REAL del gate vive en [gateway.agent_budgets] (Pitfall 1).

# Pellegrini — coach de finanzas personal (D-80/D-81). Modelo económico, sin BC
# (no indexa documentos: opera sobre el ledger), presupuesto $5/mes.
[[agents]]
agent_id = "pellegrini"
name = "Pellegrini"
domain = "finanzas"
knowledge_bases = []
model_tier = "economico"
budget_usd = 5.0
