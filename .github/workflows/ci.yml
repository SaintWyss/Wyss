name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # python-magic requiere libmagic del sistema (detección de tipo real de archivo)
      - name: Instalar libmagic
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Formato
        run: uv run ruff format --check src packages tests

      - name: Tests
        run: uv run pytest -q

      - name: Types (mypy strict)
        run: uv run mypy

      - name: Lint (ruff)
        run: uv run ruff check src packages tests

      - name: Contratos hexagonales (import-linter)
        run: uv run lint-imports

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: npm ci
      - run: npx cap sync android
      - run: bash android/gradlew -p android testDebugUnitTest assembleDebug --no-daemon
