[project]
name = "wyss"
version = "0.1.0"
description = "Asistente operativo personal multi-agente — humano primero"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13"]

[dependency-groups]
dev = ["pytest>=9", "mypy>=2.1", "ruff>=0.15", "import-linter>=2.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/core",
  "src/orchestrator",
  "src/agents",
  "src/knowledge",
  "src/gateway",
  "src/execution",
  "src/audit",
  "src/bootstrap",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.importlinter]
include_external_packages = true
root_packages = [
  "core",
  "orchestrator",
  "agents",
  "knowledge",
  "gateway",
  "execution",
  "audit",
  "bootstrap",
]

[[tool.importlinter.contracts]]
name = "core es puro: stdlib only"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = [
  "pydantic",
  "orchestrator",
  "agents",
  "knowledge",
  "gateway",
  "execution",
  "audit",
  "bootstrap",
]

[[tool.importlinter.contracts]]
name = "las capas importan de core, nunca entre sí"
type = "independence"
modules = [
  "orchestrator",
  "agents",
  "knowledge",
  "gateway",
  "execution",
  "audit",
]
