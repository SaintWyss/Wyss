[project]
name = "wyss"
version = "1.0.0.dev0"
description = "Asistente operativo personal multi-agente — humano primero"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "chromadb>=1.5.9",
    "exifread>=3.5.1",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "notion-client>=3.1.0",
    "openpyxl>=3.1.5",
    "pillow>=12.2.0",
    "pydantic>=2.13",
    "pymupdf>=1.27.2",
    "python-docx>=1.2.0",
    "python-magic>=0.4.27",
    "rich>=15.0.0",
    "send2trash>=2.1.0",
    "striprtf>=0.0.29",
    "typer>=0.26.7",
    "uvicorn>=0.49.0",
    "wyss-core",
]

[project.scripts]
wyss = "bootstrap.cli:app"

[dependency-groups]
dev = [
    "pytest>=9",
    "mypy>=2.1",
    "ruff>=0.15",
    "import-linter>=2.11",
    "respx>=0.23.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/adapters",
  "src/home",
  "src/orchestrator",
  "src/agents",
  "src/knowledge",
  "src/gateway",
  "src/execution",
  "src/audit",
  "src/bootstrap",
  "src/ledger",
  "src/memory",
  "src/notion",
]

[tool.uv.workspace]
members = ["packages/wyss-core"]

[tool.uv.sources]
wyss-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "ntfs: tests que corren sobre el mount NTFS/fuseblk real (solo con WYSS_TEST_NTFS=1)",
  "integration: tests contra servicios reales (opt-in por env var)",
  "gateway: tests del gateway de modelos (providers, router, minimizer, cost, traces)",
  "llm_judge: low-ceremony LLM-judge eval, opt-in only (consumes agent budget)",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src:packages/wyss-core/src"
strict = true
files = ["src", "packages/wyss-core/src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "packages/wyss-core/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.importlinter]
include_external_packages = true
root_packages = [
  "adapters",
  "core",
  "home",
  "orchestrator",
  "agents",
  "knowledge",
  "gateway",
  "execution",
  "audit",
  "bootstrap",
  "ledger",
  "memory",
  "notion",
]

[[tool.importlinter.contracts]]
name = "core es puro: stdlib only"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = [
  "pydantic",
  "adapters",
  "home",
  "orchestrator",
  "agents",
  "knowledge",
  "gateway",
  "execution",
  "audit",
  "bootstrap",
  "ledger",
  "memory",
  "notion",
]

[[tool.importlinter.contracts]]
name = "las capas importan de core, nunca entre sí"
type = "independence"
modules = [
  "adapters",
  "home",
  "orchestrator",
  "agents",
  "knowledge",
  "gateway",
  "execution",
  "audit",
  "ledger",
  "memory",
  "notion",
]
